server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: identity-service
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: identity-service-users
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/users/**
        - id: content-service
          uri: lb://CONTENT-SERVICE
          predicates:
            - Path=/api/content/**
        - id: content-service-exercises
          uri: lb://CONTENT-SERVICE
          predicates:
            - Path=/api/exercises/**
        - id: gamification-service
          uri: lb://GAMIFICATION-SERVICE
          predicates:
            - Path=/api/gamification/**
        - id: engine-service
          uri: lb://ENGINE-SERVICE
          predicates:
            - Path=/api/engine/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG


