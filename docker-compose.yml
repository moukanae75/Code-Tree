version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codetree-v2-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: codetree-v2-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@codetree.local
      PGADMIN_DEFAULT_PASSWORD: root
    depends_on:
      - postgres
    restart: always

volumes:
  postgres_data:
